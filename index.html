<!DOCTYPE html>
<html>
<head>
    <title>UPI QR Generator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        input {
            padding: 12px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        #qrcode {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <h1>UPI QR Code Generator</h1>

    <input type="text" id="upiId" placeholder="Enter your UPI ID">

    <br>

    <button onclick="generateQR()">Generate QR</button>

    <div id="qrcode"></div>

    <script>
        function generateQR() {

            let upiId = document.getElementById("upiId").value;

            if (upiId === "") {
                alert("Please enter UPI ID");
                return;
            }

            let upiUrl =
                `upi://pay?pa=${encodeURIComponent(upiId)}&pn=Recipient%20Name&mc=1234`;

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: upiUrl,
                width: 250,
                height: 250
            });
        }
    </script>

</body>
</html>
